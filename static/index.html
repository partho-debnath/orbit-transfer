<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Transfer | Local File Sharing</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <header>
            <div class="logo">
                <h1 style="font-size: 1.5rem; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">Orbit Transfer</h1>
            </div>
            <div class="profile">
                <span>You:</span>
                <input type="text" id="username" placeholder="Your Name">
            </div>
        </header>
        
        <main>
            <aside class="user-sidebar">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted);">Users Online</h3>
                </div>
                <ul id="user-list" class="user-list" style="margin-bottom: 30px;">
                    <!-- Users will be injected here -->
                </ul>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="font-size: 0.8rem; text-transform: uppercase; color: var(--text-muted);">Groups</h3>
                    <button id="btn-create-group" style="background: none; border: none; color: var(--primary); cursor: pointer;"><i class="fas fa-plus-circle"></i></button>
                </div>
                <ul id="group-list" class="user-list">
                    <!-- Groups will be injected here -->
                </ul>
            </aside>
            
            <section class="content-area">
                <div id="no-target" class="message">
                    <i class="fas fa-users" style="font-size: 3rem; margin-bottom: 20px; color: var(--text-muted);"></i>
                    <p>Select a user from the sidebar to start sharing</p>
                </div>
                
                <div id="transfer-zone" style="display: none; width: 100%;">
                    <div id="selected-target">Sending to <strong id="target-name">User</strong></div>
                    <div class="drop-zone" id="drop-zone">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>Drag & Drop files here or click to browse</p>
                        <input type="file" id="file-input" style="display: none;" multiple>
                    </div>
                </div>

                <div id="notifications-container" style="width: 100%; max-width: 400px;"></div>
            </section>
        </main>
    </div>

    <!-- Member Selection Modal -->
    <div id="member-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 style="font-size: 1rem;">Manage Group</h3>
                <button onclick="hideModal()" style="background:none; border:none; color:var(--text-muted); cursor:pointer;"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-user-list">
                <!-- Selectable users will be here -->
            </div>
        </div>
    </div>

    <!-- Active Transfer Card Template -->
    <div id="status-container"></div>

    <script src="/static/app.js"></script>
</body>
</html>

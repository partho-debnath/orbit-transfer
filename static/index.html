<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbit Transfer | Ultra-Fast Local Sharing</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- Premium Background Effects -->
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="app">
        <header>
            <div class="logo">
                <h1 class="logo-text">Orbit Transfer</h1>
            </div>
            <div class="profile-card">
                <i class="fas fa-user-circle" style="color: var(--primary);"></i>
                <input type="text" id="username" placeholder="Your Name" value="Anonymous">
            </div>
        </header>

        <main>
            <aside class="user-sidebar">
                <div class="section-label">
                    <span>Devices Online</span>
                </div>
                <ul id="user-list" class="user-list">
                    <!-- Users will be injected here -->
                </ul>

                <div class="section-label">
                    <span>Groups</span>
                    <button id="btn-create-group" class="btn-icon"><i class="fas fa-plus"></i></button>
                </div>
                <ul id="group-list" class="user-list">
                    <!-- Groups will be injected here -->
                </ul>
            </aside>

            <section class="content-area">
                <div id="no-target" class="empty-state">
                    <i class="fas fa-project-diagram"></i>
                    <h2 style="font-size: 1.5rem; margin-bottom: 12px;">Ready to Orbit?</h2>
                    <p style="color: var(--text-muted);">Select a peer or group from the sidebar to begin secure local
                        file sharing.</p>
                </div>

                <div id="transfer-zone"
                    style="display: none; width: 100%; flex-direction: column; align-items: center;">
                    <div id="selected-target" style="margin-bottom: 24px;">
                        <span style="color: var(--text-muted); font-size: 0.9rem;">Orbiting with</span>
                        <h3 id="target-name" style="font-size: 1.25rem; font-weight: 700;">User</h3>
                    </div>

                    <div class="drop-zone" id="drop-zone">
                        <i class="fas fa-cloud-upload-alt drop-zone-icon"></i>
                        <p style="font-weight: 600; font-size: 1.1rem; margin-bottom: 8px;">Beam Files</p>
                        <p style="color: var(--text-muted); font-size: 0.9rem;">Drag & Drop or click to browse</p>
                        <input type="file" id="file-input" style="display: none;" multiple>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Notifications & Status -->
    <div id="status-container" class="transfer-status-list"></div>
    <div id="notifications-container"></div>

    <!-- Member Selection Modal -->
    <div id="member-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
                <h3 style="font-size: 1.25rem; font-weight: 700;">Manage Orbit Group</h3>
                <button onclick="hideModal()" class="btn-icon"><i class="fas fa-times"></i></button>
            </div>
            <div id="modal-user-list">
                <!-- Selectable users will be here -->
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
